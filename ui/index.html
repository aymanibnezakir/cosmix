<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>CosmiX</title>
  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <header>
    <div class="header-left">
      <a class="brand" href="#" id="home"><span>✖</span> CosmiX</a>
      <div class="nav-group">
        <button class="nav-btn" id="navBack" title="Go back" disabled>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
        <button class="nav-btn" id="navForward" title="Go forward" disabled>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 6 15 12 9 18"/></svg>
        </button>
      </div>
    </div>
    <form id="searchForm">
      <div class="search-wrap">
        <input id="query" autocomplete="off" />
        <span id="typewriter" class="typewriter"></span>
      </div>
      <button>Search</button>
    </form>
    <div class="header-right">
      <button class="icon" id="downloads" title="Downloads">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      </button>
      <button class="icon" id="settings" title="Settings">⚙</button>
    </div>
  </header>
  <main>
    <section id="welcome" class="welcome">
      <div class="orb">▶</div>
      <h1>Let the story begin...</h1>
      <p id="welcomeSubtitle">Search MovieBox or choose another provider in settings.</p>
      <footer class="home-footer">Crafted with ❤ by Ayman Zakir</footer>
    </section>
    <section id="results" class="results hidden"></section>
    <section id="detail" class="detail hidden"></section>
  </main>
  <div id="modal" class="modal hidden">
    <div class="dialog"><button class="close" data-close>×</button>
      <h2>Settings</h2><label>Content provider<select id="provider">
          <option value="circleftp">BDIX - CircleFTP (Fastest, if works)</option>
          <option value="moviebox">MovieBox (Fast)</option>
          <option value="fourkhdhub">4KHDHub (Heavier but top-notch quality)</option>
        </select></label>
      <button id="save">Save settings</button>
    </div>
  </div>
  <div id="languageModal" class="modal hidden">
    <div class="dialog language-dialog"><button class="close" data-close>×</button>
      <h2>Select Audio Language</h2>
      <p class="hint" id="languageSubtitle">Choose in which language you want to watch</p>
      <div id="languageList" class="language-list"></div>
    </div>
  </div>
  <div id="streamModal" class="modal hidden">
    <div class="dialog streams"><button class="close" data-close>×</button>
      <h2>Select a stream</h2>
      <div id="streamList"></div>
    </div>
  </div>
  <div id="downloadModal" class="modal hidden">
    <div class="dialog downloads-dialog"><button class="close" data-close>×</button>
      <h2>Downloads</h2>
      <div id="downloadList"><p class="hint">No downloads yet.</p></div>
    </div>
  </div>
  <div id="toast" class="toast hidden"></div>
  <script type="module" src="app.js"></script>
</body>

</html>
