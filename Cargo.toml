[package]
name = "cosmix"
version = "1.9.1"
edition = "2024"

[dependencies]
base64 = "0.22"
hmac = "0.12"
md-5 = "0.10"
rand = "0.8"
dirs = "6"
futures-util = "0.3"
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream"] }
scraper = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
thiserror = "1"
tokio = { version = "1", features = ["process", "rt-multi-thread", "fs", "time", "sync", "io-util", "macros"] }
tokio-util = { version = "0.7", features = ["rt"] }
url = "2"
uuid = { version = "1", features = ["v4"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

